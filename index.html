<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEYGEN // THIÊN TRẦN</title>
<style>
  body{background:#050507;color:#cfcfcf;font-family:monospace;padding:20px;margin:0}
  .wrap{max-width:900px;margin:0 auto}
  h1{color:#ff2d55;font-size:20px;letter-spacing:4px;margin:0 0 4px;text-shadow:0 0 10px rgba(255,45,85,.6)}
  .sub{color:#5a5a5a;font-size:11px;margin-bottom:24px}
  .box{background:#0a0a0d;border:1px solid #ff2d55;padding:24px;margin-bottom:20px;box-shadow:0 0 20px rgba(255,45,85,.15)}
  .row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .label{color:#ff2d55;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
  button{padding:10px 18px;background:#ff2d55;color:#000;border:1px solid #ff2d55;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;letter-spacing:1px}
  button:hover{background:#ff4066}
  button.sec{background:#0d0d0f;color:#cfcfcf;border-color:#222}
  button.sec:hover{border-color:#ff2d55;color:#ff2d55}
  button.del{background:#0d0d0f;color:#ff2d55;border-color:#ff2d55}
  input{padding:10px;background:#000;border:1px solid #222;color:#ff2d55;font-family:inherit;font-size:12px;outline:none;width:100%;box-sizing:border-box}
  input:focus{border-color:#ff2d55}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th,td{padding:8px;border-bottom:1px solid #1a1a1a;text-align:left}
  th{color:#ff2d55;text-transform:uppercase;font-size:10px}
  td{color:#aaa}
  td.key{color:#3f3;font-family:monospace;word-break:break-all}
  .out{background:#000;border:1px solid #3f3;padding:14px;margin-top:12px;color:#3f3;font-size:13px;word-break:break-all;display:none}
  .out.show{display:block}
  #gate{position:fixed;inset:0;z-index:100;background:#050507;display:flex;align-items:center;justify-content:center;padding:20px}
  #gate.h{display:none}
  .gb{background:#0a0a0d;border:1px solid #ff2d55;padding:40px 32px;max-width:420px;width:100%;box-shadow:0 0 30px rgba(255,45,85,.3)}
  .gt{color:#ff2d55;font-size:20px;font-weight:bold;letter-spacing:4px;text-align:center;margin-bottom:6px}
  .gs{color:#555;font-size:11px;text-align:center;letter-spacing:2px;margin-bottom:28px}
  #gi{width:100%;padding:12px;background:#000;border:1px solid #222;color:#ff2d55;font-family:inherit;font-size:13px;margin-bottom:16px;outline:none;box-sizing:border-box}
  #gi:focus{border-color:#ff2d55}
  #gbn{width:100%;padding:12px;background:#ff2d55;color:#000;border:1px solid #ff2d55;font-family:inherit;font-size:13px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
  #gm{color:#ff2d55;font-size:12px;text-align:center;margin-top:14px;min-height:16px}
</style>
</head>
<body>

<div id="gate">
  <div class="gb">
    <div class="gt">KEYGEN // THIÊN TRẦN</div>
    <div class="gs">// admin access //</div>
    <input type="password" id="gi" placeholder="nhập key admin..." autocomplete="off">
    <button id="gbn">xác nhận</button>
    <div id="gm"></div>
  </div>
</div>

<div class="wrap" id="body" style="display:none">
  <h1>KEYGEN // THIÊN TRẦN</h1>
  <div class="sub">// tạo key tự verify · không cần import · bind 1 máy</div>

  <div class="box">
    <div class="label">// tạo key mới</div>
    <div class="row">
      <input id="labelIn" placeholder="nhãn (tùy chọn)" style="flex:1;min-width:200px">
      <button onclick="gen(1)">1 ngày</button>
      <button onclick="gen(7)">7 ngày</button>
      <button onclick="gen(30)">30 ngày</button>
      <button class="sec" onclick="gen(0)">vĩnh viễn</button>
    </div>
    <div class="out" id="out"></div>
  </div>

  <div class="box">
    <div class="label">// key đã tạo trên máy này</div>
    <table>
      <thead><tr><th>key</th><th>hạn</th><th>nhãn</th><th></th></tr></thead>
      <tbody id="tbody"><tr><td colspan="4" style="text-align:center;color:#444;padding:20px;font-style:italic">chưa có key nào</td></tr></tbody>
    </table>
    <div class="row" style="margin-top:16px">
      <button class="del" onclick="clearAll()">xóa lịch sử</button>
    </div>
  </div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var lsG=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var lsS=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var lsD=function(k){try{localStorage.removeItem(k)}catch(e){}};

var ADMIN='THIENTRANNHAVUACODUACONGARENA';
var SECRET='THIENTRAN_SECRET_2024_VEX';  // phải khớp với tool.html
var GB='tt_admin_gate_v1';
var KB='tt_generated_keys_v1';

/* ===== gate ===== */
function tryGate(){
  var v=($('gi').value||'').trim(),m=$('gm');
  if(!v){m.textContent='✘ key rỗng';return}
  if(v!==ADMIN){m.textContent='✘ key sai';$('gi').value='';return}
  lsS(GB,ADMIN);
  m.textContent='✔ đúng. đang mở...';m.style.color='#3f3';
  setTimeout(function(){$('gate').className='h';$('body').style.display='block';render()},300);
}
$('gbn').onclick=tryGate;
$('gi').addEventListener('keydown',function(e){if(e.key==='Enter')tryGate()});
(function autoGate(){
  try{if(lsG(GB)===ADMIN){$('gate').className='h';$('body').style.display='block';render()}}catch(e){}
})();

/* ===== hash + key format =====
   key = TT-<days_hex>-<random>-<sig>
   sig  = hash(days_hex + random + SECRET) & 0xFFFFFFFF, hex 8 ký tự
   tool tự parse days + verify sig → biết key thật/hạn
*/
function h32(s){
  var h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
  return (h>>>0).toString(16).padStart(8,'0');
}

function randStr(len){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',o='';
  if(window.crypto&&window.crypto.getRandomValues){
    var a=new Uint8Array(len);window.crypto.getRandomValues(a);
    for(var i=0;i<len;i++)o+=c.charAt(a[i]%c.length);
  }else{
    for(var j=0;j<len;j++)o+=c.charAt(Math.random()*c.length|0);
  }
  return o;
}

function makeKey(days){
  var dHex = days.toString(16).padStart(2,'0');
  var rnd = randStr(16);
  var sig = h32(dHex + rnd + SECRET);
  return 'TT-' + dHex + '-' + rnd + '-' + sig;
}

/* ===== lịch sử key tạo trên máy này (chỉ để hiển thị) ===== */
function loadHist(){try{var r=lsG(KB);return r?JSON.parse(r)||[]:[]}catch(e){return[]}}
function saveHist(a){lsS(KB,JSON.stringify(a))}

function gen(days){
  var label=($('labelIn').value||'').trim();
  var key=makeKey(days);
  var hist=loadHist();
  hist.unshift({key:key,days:days,label:label,createdAt:Date.now()});
  if(hist.length>200)hist=hist.slice(0,200);
  saveHist(hist);

  var o=$('out');
  o.className='out show';
  o.innerHTML='✔ key <b>'+(days===0?'VĨNH VIỄN':days+' NGÀY')+'</b>:<br><br>'+
    '<span style="font-size:15px;letter-spacing:1px;color:#3f3">'+key+'</span><br><br>'+
    '<span style="color:#666;font-size:11px">gửi key này cho người dùng. họ mở tool.html → nhập → bind máy họ. không cần import gì cả.</span>';
  render();
}

function render(){
  var hist=loadHist();
  var tb=$('tbody');
  if(!hist.length){
    tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:#444;padding:20px;font-style:italic">chưa có key nào</td></tr>';
    return;
  }
  var h='';
  for(var i=0;i<hist.length;i++){
    var it=hist[i];
    var exp=it.days===0?'∞':it.days+' ngày';
    var sk=it.key.replace(/'/g,"\\'");
    h+='<tr><td class="key">'+it.key+'</td><td>'+exp+'</td><td>'+(it.label||'-')+'</td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="sec" onclick="copyK(\''+sk+'\')" style="padding:4px 8px;font-size:10px">copy</button>'+
      '</td></tr>';
  }
  tb.innerHTML=h;
}

function copyK(k){
  try{navigator.clipboard.writeText(k);alert('đã copy: '+k)}
  catch(e){prompt('copy:',k)}
}

function clearAll(){
  if(!confirm('xóa lịch sử key trên máy này? (key cũ vẫn dùng được)'))return;
  lsD(KB);render();
}
</script>
</body>
</html>
